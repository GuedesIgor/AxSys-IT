<title>AxPonto Protótipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: segue o design system do site axsys.com.br (fundo quente, cartões brancos com cantos de 20px, botões pílula navy, Inter).
   Login: painel navy de apresentação + formulário. App: barra lateral clara, conteúdo em cartões. */
:root{
  --bg:#fbfaf9; --surface:#ffffff; --surface-2:#f2f0ee; --line:#e3e1de;
  --fg:#19293e; --muted:#656c7b; --subtle:#9aa1ac;
  --brand:#25578e; --brand-hover:#1e4674; --brand-fg:#ffffff; --brand-soft:#e7eef6;
  --primary:#19293e; --primary-hover:#0f1a29; --primary-fg:#ffffff;
  --amber:#b5680a; --amber-soft:#fdf3e3;
  --ok:#1a7f45; --ok-soft:#e9f7ee; --bad:#c0392b; --bad-soft:#fdecea;
  --info:#25578e; --info-soft:#e7eef6;
  --hero:#19293e; --hero-fg:#ffffff; --hero-muted:#b4c2d4; --hero-line:#ffffff24;
  --shadow:0 1px 2px rgba(25,41,62,.05),0 8px 24px -12px rgba(25,41,62,.12);
  --display:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  --body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1623; --surface:#152337; --surface-2:#1b2d45;
  --fg:#e8eef6; --muted:#9aaabf; --subtle:#6f819a;
  --brand:#78b0ea; --brand-hover:#9bc5f2; --brand-fg:#0d1623; --brand-soft:#1b3556;
  --primary:#e8eef6; --primary-hover:#ffffff; --primary-fg:#0d1623;
  --amber:#f0a74a; --amber-soft:#3a2a10;
  --ok:#5fd18a; --ok-soft:#133423; --bad:#ff8f84; --bad-soft:#3e1a17;
  --info:#78b0ea; --info-soft:#1b3556;
  --hero:#10203a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  --line:#2a3d57; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1623; --surface:#152337; --surface-2:#1b2d45; --line:#2a3d57;
  --fg:#e8eef6; --muted:#9aaabf; --subtle:#6f819a;
  --brand:#78b0ea; --brand-hover:#9bc5f2; --brand-fg:#0d1623; --brand-soft:#1b3556;
  --primary:#e8eef6; --primary-hover:#ffffff; --primary-fg:#0d1623;
  --amber:#f0a74a; --amber-soft:#3a2a10;
  --ok:#5fd18a; --ok-soft:#133423; --bad:#ff8f84; --bad-soft:#3e1a17;
  --info:#78b0ea; --info-soft:#1b3556;
  --hero:#10203a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.02em;font-weight:700}
h1{font-size:28px;line-height:1.15} h2{font-size:21px} h3{font-size:16px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9999px;padding:9px 18px;cursor:pointer;font-weight:600;font-size:13.5px}
.btn:hover{background:var(--surface-2)}
a.btn{color:inherit;text-decoration:none;display:inline-block}
.btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{padding:5px 13px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-block;padding:2px 10px;border-radius:9999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--amber-soft);color:var(--amber)} .chip.info{background:var(--info-soft);color:var(--info)}
.chip.mute{background:var(--surface-2);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;min-width:0;box-shadow:var(--shadow)}
.card>h3{margin-bottom:2px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--subtle);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:var(--bg)}
tr:last-child td{border-bottom:0}
label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
.field{margin-bottom:16px}
.err{color:var(--bad);font-size:13px;margin-top:6px}
.logo-tile{background:#fff;border-radius:12px;padding:8px 14px;display:inline-flex;align-items:center}
.logo-tile img{display:block;height:34px;width:auto}
.logo-tile.lg img{height:44px}

/* login */
.login{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:stretch}
@media(max-width:860px){.login{grid-template-columns:1fr}}
.hero{background:var(--hero);color:var(--hero-fg);border-radius:24px;padding:34px;display:flex;flex-direction:column;gap:22px;justify-content:space-between;background-image:radial-gradient(120% 80% at 100% 0%,#25578e55 0%,transparent 60%)}
.hero h1{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.03em}
.hero .eyebrow{color:#8fc0f2}
.hero p{color:var(--hero-muted);font-size:15px;margin:0;max-width:46ch}
.feats{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.feats li{display:flex;gap:12px;align-items:flex-start;color:#e4ecf6;font-size:14px}
.feats li b{display:block;color:#fff}
.feats i{flex:none;width:30px;height:30px;border-radius:9px;background:#ffffff14;border:1px solid var(--hero-line);display:grid;place-items:center;font-style:normal;font-weight:700;color:#8fc0f2;font-size:13px}
.hero .banner{background:#ffffff12;border:1px solid var(--hero-line);color:#f5d9a8}
.rcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.banner{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:500}
.users td:first-child{font-weight:600}
.users code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 7px;border-radius:6px}

/* app shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);gap:20px;max-width:1320px;margin:0 auto;align-items:start}
.side{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:24px;padding:18px 14px;position:sticky;top:20px;display:flex;flex-direction:column;gap:4px}
.side .logo-tile{padding:4px 6px;margin:0 4px 14px}
.side .logo-tile img{height:32px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 14px;border-radius:9999px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav button:focus-visible{outline:3px solid var(--brand)}
.nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--subtle);padding:16px 14px 6px;font-weight:600}
.badge{background:var(--amber);color:#fff;border-radius:99px;padding:0 8px;font-size:12px;font-weight:700}
.me{margin-top:14px;padding:14px 8px 4px;border-top:1px solid var(--line);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.av{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none}
.me .who{min-width:0;flex:1}
.main{display:flex;flex-direction:column;gap:20px;min-width:0}
.head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;padding:4px 2px}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;flex-direction:row;flex-wrap:wrap;align-items:center;border-radius:20px}
  .side .logo-tile{margin:0 8px 0 0}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav .sec{display:none}
  .me{margin:0;border:0;padding:0 4px}
}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.kpi .n{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.kpi .l{color:var(--muted);font-size:13px;margin-top:2px}

/* ponto */
.clock{font-size:clamp(46px,9vw,76px);font-weight:300;letter-spacing:-.04em;line-height:1}
.punches{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.pbtn{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.pbtn .t{font-weight:600}
.pbtn .h{color:var(--muted);font-size:13px}
.pbtn.next{border:2px solid var(--brand);background:var(--brand-soft)}
.pbtn.next .t{color:var(--brand)}
.pbtn.next:hover{background:var(--surface)}
.pbtn.done{background:var(--ok-soft);border-color:transparent}
.pbtn.done .h{color:var(--ok);font-weight:600}
.pbtn:disabled{cursor:default}
.pbtn.next:disabled{opacity:.6;cursor:not-allowed}
.timeline{display:flex;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.timeline i{display:block;background:var(--brand);border-radius:99px}
.receipt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--surface-2);border:1px dashed var(--subtle);border-radius:12px;padding:14px;white-space:pre-wrap}

/* modal e toast */
.overlay{position:fixed;inset:0;background:rgba(13,22,35,.55);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:24px;max-width:480px;width:100%;padding:26px;max-height:92%;overflow:auto;border:1px solid var(--line);box-shadow:0 24px 60px -20px rgba(0,0,0,.45)}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--primary);color:var(--primary-fg);padding:11px 20px;border-radius:9999px;z-index:60;font-weight:500;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.sat td,.sun td{background:var(--bg);color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.log{font-size:12.5px}
.locbox{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.locbox.need{border-color:var(--amber);background:var(--amber-soft)}
.map{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--line)}
.map .bg{fill:var(--surface)} .map .park{fill:var(--ok-soft)} .map .st{stroke:var(--line);fill:none}
.map .lbl{font:600 10px var(--body);fill:var(--fg);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.map .scl{stroke:var(--fg);stroke-width:2;fill:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--brand);margin-right:5px}
.legend i.sq{border-radius:2px;background:var(--amber)}
details.sim{font-size:13px}
details.sim summary{cursor:pointer;color:var(--muted);font-weight:500}
details.sim .row2{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
@media(prefers-reduced-motion:no-preference){.pbtn,.btn,.nav button{transition:background .15s,color .15s,border-color .15s}}
</style>

function seedPunches(users){
  var P={};
  users.forEach(function(u){
    P[u.id]={};
    if(u.perfil==='rh'||u.perfil==='admin'&&false){}
    var j=JORNADAS[u.jornada];
    var start=u.jornada==='red'?480:u.jornada==='est'?780:540;
    for(var k=1;k<=45;k++){
      var d=new Date();d.setDate(d.getDate()-k);
      var w=d.getDay(); if(w===0||w===6) continue;
      var key=iso(d), h=hash(u.id+key);
      var jit=(h%11)-4, e=start+jit;
      var arr=[];
      var out=e+j.min+j.intervalo+((h>>3)%9)-3;
      if(j.intervalo>0){
        var sa=e+240+((h>>2)%15), va=sa+j.intervalo+((h>>4)%8);
        arr=[['entrada',e],['saida_almoco',sa],['volta_almoco',va],['saida',out]];
      } else arr=[['entrada',e],['saida',out]];
      /* ocorrências para teste */
      if(u.id==='u5'&&k===3) arr=arr.slice(0,3);          /* Ana esqueceu a saída */
      if(u.id==='u6'&&k===5) arr=[];                      /* Bruno faltou */
      if(u.id==='u8'&&k===2) arr=arr.slice(0,1);          /* Diego só entrada */
      if(u.id==='u5'&&k===9) arr=arr.map(function(x){return x[0]==='entrada'?['entrada',e+47]:x}); /* atraso */
      if(u.ativo===false&&k>20) arr=[];
      P[u.id][key]=arr.map(function(x){return {tipo:x[0],hora:hm(x[1]),orig:'web'}});
    }
    var t=new Date(); if(t.getDay()!==0&&t.getDay()!==6){
      var seed={u6:1,u7:2,u8:3,u9:1}[u.id];
      if(seed){var base=start+2, pre=[['entrada',base],['saida_almoco',base+240],['volta_almoco',base+240+j.intervalo]].slice(0,seed);
        var nowM=toMin(nowHM());
        pre=pre.filter(function(x){return x[1]<=nowM});
        P[u.id][TODAY]=pre.map(function(x){return {tipo:x[0],hora:hm(x[1]),orig:'web'}});}
    }
  });
  return P;
}

function dayInfo(uid,date){
  var u=U(uid), j=JORNADAS[u.jornada], arr=(S.punches[uid]||{})[date]||[];
  var w=parseISO(date).getDay(), fds=(w===0||w===6);
  var m={};arr.forEach(function(p){m[p.tipo]=toMin(p.hora)});
  var worked=0, complete=false, incompleto=false;
  if(j.intervalo>0){
    if(m.entrada!=null&&m.saida_almoco!=null) worked+=m.saida_almoco-m.entrada;
    if(m.volta_almoco!=null&&m.saida!=null) worked+=m.saida-m.volta_almoco;
    complete=arr.length===4;
  } else { if(m.entrada!=null&&m.saida!=null)worked=m.saida-m.entrada; complete=arr.length>=2; }
  var future=date>TODAY, isToday=date===TODAY;
  var pend=S.adj.some(function(a){return a.uid===uid&&a.data===date&&a.status==='pendente'});
  var st;
  if(future) st='futuro';
  else if(!arr.length) st=fds?'folga':(isToday?'aguardando':'falta');
  else if(!complete) st=isToday?'andamento':'incompleto';
  else st='ok';
  var saldo=(st==='ok')?worked-j.min:null;
  return {arr:arr,m:m,worked:worked,st:st,saldo:saldo,fds:fds,pend:pend,esperado:fds?0:j.min,j:j};
}

  var h='<span class="chip '+c[0]+'">'+c[1]+'</span>';
  if(i.pend)h+=' <span class="chip warn">Ajuste pendente</span>';
  return h;
}
function monthDays(ym){
  var p=ym.split('-'),y=+p[0],m=+p[1]-1,out=[],d=new Date(y,m,1);
  while(d.getMonth()===m){out.push(iso(d));d.setDate(d.getDate()+1)}return out;
}
function monthSummary(uid,ym){
  var days=monthDays(ym),worked=0,saldo=0,faltas=0,inc=0,ok=0;
  days.forEach(function(d){var i=dayInfo(uid,d);
    if(i.st==='ok'){ok++;worked+=i.worked;saldo+=i.saldo}
    else if(i.st==='falta')faltas++;
    else if(i.st==='incompleto')inc++;});
  return {worked:worked,saldo:saldo,faltas:faltas,inc:inc,ok:ok};
}

function doLogin(){
  var em=document.getElementById('em').value.trim().toLowerCase(), pw=document.getElementById('pw').value;
  ui.email=em;ui.senha='';
  var u=S.users.filter(function(x){return x.email===em})[0];
  if(!u){ui.err='E-mail ou senha incorretos.';return render()}
  if(!u.ativo){ui.err='Esta conta está inativa. Procure o RH.';log('Login negado','Conta inativa: '+u.email);return render()}
  if((S.fails[u.id]||0)>=3){ui.err='Conta bloqueada após 3 tentativas. Procure o RH para redefinir a senha.';return render()}
  if(u.senha!==pw){S.fails[u.id]=(S.fails[u.id]||0)+1;save();ui.err='E-mail ou senha incorretos. Tentativa '+S.fails[u.id]+' de 3.';return render()}
  S.fails[u.id]=0;session=u;ui.err='';ui.senha='';ui.email='';log('Login','Perfil '+PERFIS[u.perfil]);route=home();ui.mes=TODAY.slice(0,7);ui.ver=null;loc={status:'idle'};render();
  if(route==='ponto')requestLoc();
}
function decide(id,st,resp){
  var a=S.adj.filter(function(x){return x.id===id})[0];if(!a)return;
  a.status=st;a.resp=resp||'';
  if(st==='aprovado'){
    var day=(S.punches[a.uid][a.data]=S.punches[a.uid][a.data]||[]);
    var ex=day.filter(function(p){return p.tipo===a.tipo})[0];
    if(ex){ex.hora=a.hora;ex.orig='ajuste'}else day.push({tipo:a.tipo,hora:a.hora,orig:'ajuste'});
    var order=TIPOS.map(function(t){return t[0]});
    day.sort(function(p,q){return order.indexOf(p.tipo)-order.indexOf(q.tipo)});
  }
  log('Ajuste '+st,U(a.uid).nome+' · '+fdate(a.data)+' · '+tipoNome(a.tipo)+' '+a.hora);
}

document.addEventListener('input',function(e){if(e.target.id==='em')ui.email=e.target.value});
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  if(a==='ovl'){if(e.target===el){modal=null;render()}return}
  if(a==='quick'){var u=U(id);ui.email=u.email;ui.senha=u.senha;ui.err='';render();return}
  if(a==='reset'){S=fresh();save();session=null;ui={mes:TODAY.slice(0,7),err:'',email:'',senha:''};toast('Dados do protótipo reiniciados.');return}
  if(a==='nav'){ui.ver=null;go(el.getAttribute('data-r'));return}
  if(a==='logout'){log('Logout','');session=null;modal=null;loc={status:'idle'};render();return}
  if(a==='reqloc'){requestLoc();return}
  if(a==='simloc'){var sm=SIMS[+el.getAttribute('data-i')];loc={status:'ok',lat:sm.lat,lng:sm.lng,acc:sm.acc,sim:true};render();return}
  if(a==='simdeny'){loc={status:'negado'};render();return}
  if(a==='close'){modal=null;render();return}
  if(a==='punch'){
    if(loc.status!=='ok')return toast('Permita a localização para registrar o ponto.');
    modal={k:'punch',tipo:nextTipo(session.id)};render();return}
  if(a==='confirmpunch'){
    if(loc.status!=='ok'){modal=null;return toast('Sem localização, o ponto não foi registrado.')}
    var t=modal.tipo,h=nowHM(),arr=(S.punches[session.id][TODAY]=S.punches[session.id][TODAY]||[]);
    if(nextTipo(session.id)!==t){modal=null;return toast('Este registro já foi feito.')}
    var dd=distM(loc.lat,loc.lng,SEDE.lat,SEDE.lng),area=dd<=200?'Na área da empresa':'Fora da área da empresa ('+fmtDist(dd)+')';
    arr.push({tipo:t,hora:h,orig:'web',local:{lat:loc.lat,lng:loc.lng,acc:loc.acc,sim:loc.sim}});S.seq++;
    var comp='AX-'+TODAY.replace(/-/g,'')+'-'+S.seq;
    log('Ponto registrado',tipoNome(t)+' '+h+' · '+comp+' · '+loc.lat.toFixed(5)+','+loc.lng.toFixed(5));
    modal={k:'receipt',txt:'COMPROVANTE DE REGISTRO DE PONTO\nNº '+comp+'\nColaborador: '+session.nome+'\nRegistro: '+tipoNome(t)+'\nData: '+fdate(TODAY)+'  Hora: '+h+'\nLocal: '+loc.lat.toFixed(5)+', '+loc.lng.toFixed(5)+' (±'+loc.acc+' m)'+(loc.sim?' [simulada]':'')+'\n'+area+'\nOrigem: web'};
    render();return}
  if(a==='ajuste'){modal={k:'ajuste',date:el.getAttribute('data-date')||''};render();return}
  if(a==='sendajuste'){
    var d=document.getElementById('ad').value,tp=document.getElementById('at').value,hh=document.getElementById('ah').value,jj=document.getElementById('aj').value.trim();
    if(!d||d>TODAY){modal.err='Escolha um dia que já passou ou hoje.';return render()}
    if(!hh){modal.err='Informe o horário correto.';return render()}
    if(jj.length<10){modal.err='Descreva o motivo com pelo menos 10 caracteres.';return render()}
    S.seq++;S.adj.push({id:'a'+S.seq,uid:session.id,data:d,tipo:tp,hora:hh,just:jj,status:'pendente',criado:TODAY});
    log('Ajuste solicitado',fdate(d)+' · '+tipoNome(tp)+' '+hh);modal=null;route='meusajustes';toast('Solicitação enviada ao gestor.');return}
  if(a==='aprovar'){decide(id,'aprovado','');toast('Ajuste aprovado e aplicado ao espelho.');return}
  if(a==='recusar'){modal={k:'recusa',id:id};render();return}
  if(a==='confirmrecusa'){var r=document.getElementById('rj').value.trim();decide(modal.id,'recusado',r||'Sem motivo informado');modal=null;toast('Ajuste recusado.');return}
  if(a==='verespelho'){ui.ver=id;ui.mes=TODAY.slice(0,7);route='verespelho';render();return}
  if(a==='voltar'){ui.ver=null;go('equipe');return}
  if(a==='toggle'){var x=U(id);x.ativo=!x.ativo;log(x.ativo?'Usuário ativado':'Usuário desativado',x.email);toast(x.nome+(x.ativo?' ativado(a).':' desativado(a).'));return}
  if(a==='resetpw'){var y=U(id);y.senha=y.perfil==='func'?'Func@1234':y.senha;S.fails[id]=0;log('Senha redefinida',y.email);toast('Senha de '+y.nome+' redefinida e conta desbloqueada.');return}
  if(a==='novo'){modal={k:'novo'};render();return}
  if(a==='salvanovo'){
    var nn=document.getElementById('nn').value.trim(),ne=document.getElementById('ne').value.trim().toLowerCase();
    if(nn.length<3){modal.err='Informe o nome completo.';return render()}
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(ne)){modal.err='Informe um e-mail válido.';return render()}
    if(S.users.some(function(u){return u.email===ne})){modal.err='Já existe um usuário com este e-mail.';return render()}
    var pf=document.getElementById('np').value;S.seq++;
    var nu={id:'u'+S.seq,nome:nn,email:ne,senha:'Func@1234',perfil:pf,ativo:true,jornada:document.getElementById('nj').value,gestor:pf==='func'?document.getElementById('ng').value:null};
    S.users.push(nu);S.punches[nu.id]={};log('Usuário criado',ne+' · '+PERFIS[pf]);modal=null;toast('Colaborador cadastrado.');return}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&modal){modal=null;render()}});
setInterval(function(){var c=document.getElementById('clk');if(c)c.textContent=new Date().toLocaleTimeString('pt-BR')},1000);
render();
})();
</script>
