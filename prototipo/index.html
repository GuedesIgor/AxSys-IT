  --display:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  --body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;

*{box-sizing:border-box}

input,select,textarea{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}

.cellbtn{all:unset;cursor:pointer;border-radius:9999px}
.cellbtn:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

/* ================= UTILITÁRIOS ================= */
function pad(n){return (n<10?'0':'')+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseISO(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)}

function toMin(s){var p=s.split(':');return +p[0]*60+ +p[1]}

  try{navigator.geolocation.getCurrentPosition(function(p){if(done||loc.status!=='pedindo')return;done=true;loc={status:'ok',lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy),sim:false};render()},fail,{enableHighAccuracy:true,timeout:10000,maximumAge:0})}catch(e){fail()}

}

function qrSvg(seed){
  var N=25,h=hash(seed),cells='',x,y;
  function finder(ox,oy){return '<rect x="'+ox+'" y="'+oy+'" width="7" height="7" fill="currentColor"/><rect x="'+(ox+1)+'" y="'+(oy+1)+'" width="5" height="5" fill="var(--surface)"/><rect x="'+(ox+2)+'" y="'+(oy+2)+'" width="3" height="3" fill="currentColor"/>'}

var GRUPOS=[['atraso','Atrasos e ausências hoje','bad'],['ptsl','Pontos sem localização ou sem validação facial aguardando decisão','bad'],['semsaida','Marcação ímpar (últimos 15 dias)','bad'],['falta','Faltas sem justificativa','bad'],['naoesc','Batidas fora da escala (folga, fim de semana, feriado)','info'],['fora','Batidas fora da área da empresa','warn'],['disp','Batidas em aparelho diferente','warn'],['offline','Batidas offline sem sincronizar','warn'],['extra','Horas extras acima do limite','warn'],['espelho','Espelhos do mês anterior pendentes','warn']];
function excecoes(users){
  var G={},tol=S.cfg.tolerancia,nowM=toMin(nowHM()),pm=prevYm();
  GRUPOS.forEach(function(g){G[g[0]]=[]});
  users.forEach(function(u){
    if(!u.ativo)return;
    var sc=schedFor(u.id,TODAY),i=dayInfo(u.id,TODAY);
    if(!sc.folga&&!i.aus&&u.admissao<=TODAY){
      if(!i.arr.length&&nowM>sc.ini+tol)G.atraso.push({uid:u.id,d:TODAY,txt:'Sem entrada. Previsto para '+hm(sc.ini)});
      else if(i.m.entrada!=null&&i.m.entrada>sc.ini+tol)G.atraso.push({uid:u.id,d:TODAY,txt:'Entrou às '+hm(i.m.entrada)+' ('+(i.m.entrada-sc.ini)+' min de atraso)'});
    }
    for(var k=0;k<=15;k++){
      var d=addDays(TODAY,-k),x=dayInfo(u.id,d),al=alertas(u.id,d);
      if(x.st==='incompleto')G.semsaida.push({uid:u.id,d:d,txt:'Batidas: '+(x.arr.map(function(p){return p.hora}).join(' · ')||'nenhuma')});
      if(x.st==='falta'&&!x.pend)G.falta.push({uid:u.id,d:d,txt:'Sem registro e sem justificativa'});
      if(x.arr.length&&x.sc.folga)G.naoesc.push({uid:u.id,d:d,txt:(x.sc.hol||(x.sc.fds?'Fim de semana':'Folga'))+', '+hm(x.worked)+' trabalhadas'});
      if(x.arr.some(function(p){return p.fora}))G.fora.push({uid:u.id,d:d,txt:x.arr.filter(function(p){return p.fora})[0].just||'Sem justificativa'});
      if(x.arr.some(function(p){return p.disp&&p.disp!==u.disp}))G.disp.push({uid:u.id,d:d,txt:x.arr.filter(function(p){return p.disp!==u.disp})[0].disp});
      if(x.arr.some(function(p){return p.orig==='offline'&&p.sync===false}))G.offline.push({uid:u.id,d:d,txt:'Salva no aparelho'});
      al.forEach(function(a){if(a.txt.indexOf('acima do limite')>0)G.extra.push({uid:u.id,d:d,txt:a.txt})});
    }
    var f=fechState(u.id,pm);
    if(!f.ass)G.espelho.push({uid:u.id,d:null,txt:'Espelho não assinado pelo colaborador'});
    else if(!f.apr)G.espelho.push({uid:u.id,d:null,txt:'Assinado, aguardando aprovação do gestor'});
    else if(!f.fec&&(session.perfil==='rh'||session.perfil==='admin'))G.espelho.push({uid:u.id,d:null,txt:'Aprovado, aguardando fechamento do RH'});
  });
  S.pend.forEach(function(q){if(q.status==='pendente'&&users.some(function(x){return x.id===q.uid&&x.ativo}))G.ptsl.push({uid:q.uid,d:q.data,txt:tipoNome(q.tipo)+' às '+q.hora+' sem localização. Justificativa: '+q.just})});
  return G;
}

function doLogin(){
  var em=document.getElementById('em').value.trim().toLowerCase(),pw=document.getElementById('pw').value;
  ui.email=em;ui.senha='';
  var u=S.users.filter(function(x){return x.email===em})[0];
  if(!u){ui.err='E-mail ou senha incorretos.';return render()}
  if(!u.ativo){ui.err='Esta conta está inativa. Procure o RH.';log('Login negado','Conta inativa: '+u.email,u.nome);return render()}
  if((S.fails[u.id]||0)>=3){ui.err='Conta bloqueada após 3 tentativas. Procure o RH para redefinir a senha.';return render()}
  if(u.senha!==pw){S.fails[u.id]=(S.fails[u.id]||0)+1;save();ui.err='E-mail ou senha incorretos. Tentativa '+S.fails[u.id]+' de 3.';return render()}
  S.fails[u.id]=0;session=u;ui.err='';ui.senha='';ui.email='';log('Login','Perfil '+PERFIS[u.perfil]);ui.mes=THIS_YM;ui.ver=null;loc={status:'idle'};ui.disp='hab';ui.offline=false;ui.sem=null;
  route=home();render();if(route==='ponto')requestLoc();
}
function decideAdj(id,st,resp){
  var a=S.adj.filter(function(x){return x.id===id})[0];if(!a)return false;
  if(mesFechado(a.uid,a.data)){toast('Este mês já foi fechado pelo RH.');return false}
  a.status=st;a.resp=resp||'';
  if(st==='aprovado'){
    var day=(S.punches[a.uid][a.data]=S.punches[a.uid][a.data]||[]),ex=day.filter(function(p){return p.tipo===a.tipo})[0],order=TIPOS.map(function(t){return t[0]});
    if(ex){ex.hora=a.hora;ex.orig='ajuste'}else day.push({tipo:a.tipo,hora:a.hora,orig:'ajuste'});
    day.sort(function(p,q){return order.indexOf(p.tipo)-order.indexOf(q.tipo)});
  }
  log('Ajuste '+st,U(a.uid).nome+' · '+fdate(a.data)+' · '+tipoNome(a.tipo)+' '+a.hora);return true;
}
function doPunch(){
  var m=modal,c=punchCtx(m),u=c.u;
  if(c.bloq)return render();
  if(!m.selfie){m.err='Faça a validação facial com prova de vida para continuar.';return render()}
  var just=(mv('pj')||'').trim();
  if(c.needJust&&just.length<5){m.err='Explique o motivo de estar fora da área (mínimo 5 caracteres).';return render()}
  if(nextTipo(u.id)!==m.tipo){modal=null;return toast('Este registro já foi feito.')}
  var h=nowHM(),arr=(S.punches[u.id][TODAY]=S.punches[u.id][TODAY]||[]),off=m.orig==='web'&&ui.offline&&S.cfg.offline;
  var p={tipo:m.tipo,hora:h,orig:off?'offline':m.orig,disp:m.orig==='quiosque'?u.disp:(ui.disp==='outro'?DEV_OUTRO:DEV_HAB),local:{lat:c.l.lat,lng:c.l.lng,acc:c.l.acc,sim:!!c.l.sim},selfie:true,sim:m.sim,alt:!!m.alt};
  if(c.ar.fora){p.fora=true;if(just)p.just=just}
  if(off)p.sync=false;
  var pr=mv('pp');if(m.tipo==='entrada'&&pr)p.proj=pr;
  arr.push(p);S.seq++;
  var comp='AX-'+TODAY.replace(/-/g,'')+'-'+S.seq;
  log('Ponto registrado',tipoNome(m.tipo)+' '+h+' · '+comp+' · '+c.l.lat.toFixed(5)+','+c.l.lng.toFixed(5)+' · '+p.orig+(p.fora?' · fora da área':''),u.nome);
  modal={k:'receipt',txt:'COMPROVANTE DE REGISTRO DE PONTO\nNº '+comp+'\nColaborador: '+u.nome+' ('+u.matricula+')\nRegistro: '+tipoNome(m.tipo)+'\nData: '+fdate(TODAY)+'  Hora: '+h+'\nLocal: '+c.l.lat.toFixed(5)+', '+c.l.lng.toFixed(5)+' (±'+c.l.acc+' m)'+(c.l.sim?' [simulada]':'')+'\n'+c.ar.txt+(just?'\nMotivo: '+just:'')+'\nOrigem: '+p.orig+(off?' (aguardando sincronização)':'')+'\nAparelho: '+p.disp+(m.alt?'\nValidação: método alternativo autorizado pelo RH (PIN)':'\nValidação facial com prova de vida: aprovada ('+m.sim+'%, simulada)')+(p.proj?'\nProjeto: '+p.proj:'')};
  render();
}

function saveColab(){
  var m=modal,e=m.id?U(m.id):null;function g(id,k,d){return mv(id,e?e[k]:d)}
  var nome=(g('cn','nome','')||'').trim(),em=(g('ce','email','')||'').trim().toLowerCase(),cpf=(g('cc','cpf','')||'').trim(),pin=(g('cx','pin','')||'').trim();
  if(nome.length<3){m.err='Informe o nome completo.';return render()}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){m.err='Informe um e-mail válido.';return render()}
  if(S.users.some(function(u){return u.email===em&&(!e||u.id!==e.id)})){m.err='Já existe um usuário com este e-mail.';return render()}
  var cp=cpf;if(cpf.indexOf('*')<0){var dg=cpf.replace(/\D/g,'');if(dg.length!==11){m.err='O CPF deve ter 11 dígitos.';return render()}cp='***.'+dg.slice(3,6)+'.'+dg.slice(6,9)+'-**'}
  if(!/^\d{4}$/.test(pin)){m.err='O PIN deve ter 4 dígitos.';return render()}
  var alt2=mv('cva',e&&e.metodoAlt?'alt':'facial')==='alt';
  if(!alt2&&!m.selfie&&!(e&&e.face)){m.err='O cadastro facial com prova de vida é obrigatório para cadastrar o usuário.';return render()}
  var perfil=g('cp','perfil','func')||'func',o={nome:nome,email:em,cpf:cp,tel:g('ct','tel','')||'',setor:g('cs','setor',S.setores[0])||S.setores[0],cargo:(g('cg','cargo','')||'').trim()||'A definir',unidade:g('cu','unidade','sp')||'sp',perfil:perfil,gestor:perfil==='func'?(g('cm','gestor','')||null):null,jornada:g('cj','jornada','com')||'com',contrato:g('cr','contrato','CLT')||'CLT',admissao:g('ca','admissao',TODAY)||TODAY,valorHora:+g('cv','valorHora',30)||0,cc:g('ck','cc','CC-000')||'CC-000',pin:pin};
  if(m.selfie)o.face={em:TODAY,q:m.sim||95};
  o.metodoAlt=alt2?{desde:(e&&e.metodoAlt?e.metodoAlt.desde:TODAY),rev:addDays(TODAY,180),por:session.nome}:null;
  if(alt2&&!(e&&e.metodoAlt))log('Método alternativo autorizado',nome+' · autorizado por '+session.nome);
  if(e){Object.keys(o).forEach(function(k){e[k]=o[k]});log('Cadastro alterado',e.email+(m.selfie?' · rosto recadastrado':''))}
  else{S.seq++;o.id='u'+S.seq;o.senha='Func@1234';o.ativo=true;o.matricula='AX-'+('0000'+(S.users.length+1)).slice(-4);o.disp=DEV_HAB;S.users.push(o);S.punches[o.id]={};log('Usuário criado',em+' · '+PERFIS[perfil]+' · '+o.setor+' · rosto cadastrado')}
  modal=null;toast(e?'Cadastro atualizado.':'Colaborador cadastrado. Senha provisória: Func@1234.');
}
function saveInp(){
  var m=modal,k=m.tipo,v1=(mv('i1')||'').trim();
  if(k==='aviso'){var tx=(mv('i2')||'').trim();if(v1.length<3||tx.length<5){m.err='Preencha o título e a mensagem.';return render()}S.seq++;S.avisos.push({id:'v'+S.seq,autor:session.nome,alvo:mv('i3')||'Todos',titulo:v1,texto:tx,data:TODAY});log('Aviso publicado',v1);modal=null;return toast('Aviso publicado no mural.')}

  if(k==='setor'){if(S.setores.indexOf(v1)>=0){m.err='Este setor já existe.';return render()}S.setores.push(v1)}
  else if(k==='projeto'){if(S.projetos.indexOf(v1)>=0){m.err='Este projeto já existe.';return render()}S.projetos.push(v1)}

  else if(k==='jornada'){var hr=parseFloat(mv('i2','8')),it=parseInt(mv('i3','60'),10),en=mv('i4','09:00');if(!(hr>=1&&hr<=12)||isNaN(it)||it<0){m.err='Revise horas e intervalo.';return render()}S.seq++;S.jornadas['j'+S.seq]={nome:v1,desc:'Seg a Sex, '+en+', '+(it?it+' min de intervalo':'sem intervalo'),min:Math.round(hr*60),intervalo:it,ini:toMin(en)}}
  log('Cadastro criado',INP_TIT[k]+': '+v1);modal=null;toast('Salvo.');
}
